<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐊 BABA Crypto - Alat Riset 100x</title>
    <!-- Menggunakan CSS Tailwind (Play CDN) untuk tampilan ramah HP -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #d9f7be; color: #14532d; }
    </style>
</head>
<body class="p-4 font-sans max-w-md mx-auto">

    <!-- Header -->
    <div class="text-center my-6">
        <h1 class="text-3xl font-black text-emerald-700 tracking-wide">🐊 BABA CRYPTO</h1>
        <p class="text-xs text-emerald-800 mt-1">Alat Riset On-Chain Koin Micin Potensi 100x</p>
    </div>

    <!-- Input Form -->
    <div class="bg-white p-4 rounded-2xl border border-emerald-300 shadow-xl mb-6">
        <label class="block text-xs font-bold text-emerald-700 mb-2 uppercase tracking-wider">Masukkan Alamat Kontrak Token (CA)</label>
        <div class="flex gap-2">
            <input type="text" id="caInput" placeholder="Tempel CA token di sini..." 
                class="w-full bg-emerald-50 border border-emerald-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-600 font-mono text-emerald-800">
            <button onclick="mulaiRiset()" id="btnCari" 
                class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 text-sm rounded-xl transition duration-200">
                Riset
            </button>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loader" class="hidden text-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600 mx-auto mb-2"></div>
        <p class="text-xs text-emerald-800">Mengambil data dari blockchain...</p>
    </div>

    <!-- Hasil Analisis -->
    <div id="hasil" class="hidden space-y-4">
        <!-- Profil -->
        <div class="bg-white p-4 rounded-2xl border border-emerald-300">
            <h2 class="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-3">📌 Profil Aset</h2>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span class="text-emerald-700">Nama Token:</span> <span id="tNama" class="font-bold text-emerald-900"></span></div>
                <div class="flex justify-between"><span class="text-emerald-700">Market Cap:</span> <span id="tMc" class="font-bold text-emerald-700"></span></div>
                <div class="flex justify-between"><span class="text-emerald-700">Total Likuiditas:</span> <span id="tLiq" class="font-bold text-emerald-900"></span></div>
                <div class="flex justify-between"><span class="text-emerald-700">Volume 24 Jam:</span> <span id="tVol" class="font-bold text-emerald-900"></span></div>
                <div class="flex justify-between"><span class="text-emerald-700">Rasio Transaksi:</span> <span id="tRasio" class="font-bold text-emerald-600"></span></div>
            </div>
        </div>

        <!-- Audit & Proyeksi -->
        <div class="bg-white p-4 rounded-2xl border border-emerald-300">
            <h2 class="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-3">🛡️ Hasil Uji & Proyeksi 100x</h2>
            <div id="logAnalisis" class="space-y-3 text-xs leading-relaxed"></div>
        </div>

        <!-- Kesimpulan Akhir -->
        <div id="boxKesimpulan" class="p-4 rounded-2xl text-center font-bold text-sm border"></div>
    </div>

    <script>
        async function mulaiRiset() {
            const ca = document.getElementById('caInput').value.trim();
            if (!ca) return alert('Tolong masukkan Alamat Kontrak (CA) koin dulu!');

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('hasil').classList.add('hidden');

            try {
                // Menembak API Publik Dexscreener untuk multi-chain
                const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
                const data = await res.json();

                document.getElementById('loader').classList.add('hidden');

                if (!data.pairs || data.pairs.length === 0) {
                    alert('Token tidak ditemukan di rantai manapun. Pastikan CA benar.');
                    return;
                }

                // Mengambil pool utama secara otomatis dari jaringan apa pun yang aktif
                const pair = data.pairs[0];
                const chainId = pair.chainId.toUpperCase();
                
                // Isi Profil Aset
                document.getElementById('tNama').innerText = `${pair.baseToken.name} (${pair.baseToken.symbol}) [${chainId}]`;
                const mc = pair.fdv || pair.marketCap || 0;
                const liq = pair.liquidity ? pair.liquidity.usd : 0;
                const vol = pair.volume ? pair.volume.h24 : 0;
                const buys = pair.txns?.h24?.buys || 0;
                const sells = pair.txns?.h24?.sells || 0;
                const totalTxs = buys + sells;
                const buyRatio = totalTxs > 0 ? (buys / totalTxs) : 0;

                document.getElementById('tMc').innerText = `$${mc.toLocaleString()}`;
                document.getElementById('tLiq').innerText = `$${liq.toLocaleString()}`;
                document.getElementById('tVol').innerText = `$${vol.toLocaleString()}`;
                document.getElementById('tRasio').innerText = `${buys} Beli / ${sells} Jual (${(buyRatio*100).toFixed(1)}%)`;

                // Logika Algoritma Analisis 100x
                let htmlLog = `<p class="text-emerald-700 font-bold mb-1">🔗 Jaringan Terdeteksi: ${chainId}</p>`;
                let lulusKeamanan = true;
                let lulusVolume = false;

                // 1. Audit Likuiditas
                if (liq < 15000) {
                    htmlLog += `<p class="text-red-500">❌ <b>Likuiditas Tipis:</b> Kumpulan dana di bawah $15k. Sangat rawan jebakan pasar / slip harga tinggi.</p>`;
                    lulusKeamanan = false;
                } else {
                    htmlLog += `<p class="text-emerald-600">✅ <b>Likuiditas Aman:</b> Kolam dana cukup tebal untuk ritel.</p>`;
                }

                // 2. Matematika Batas Atas Pompa 100x
                if (mc < 10000) {
                    htmlLog += `<p class="text-red-500">❌ <b>Matematika Cap:</b> Market Cap terlalu mini (< $10k), kemungkinan proyek gagal/ditinggalkan.</p>`;
                } else if (mc > 5000000) {
                    htmlLog += `<p class="text-yellow-600">⚠️ <b>Matematika Cap:</b> Market cap saat ini sudah di atas $5M. Untuk pump 100x ke depan membutuhkan dana raksasa, peluang eksponensial berkurang.</p>`;
                } else {
                    const targetMc = mc * 100;
                    htmlLog += `<p class="text-emerald-600">✅ <b>Matematika Cap Ideal:</b> Target MC untuk 100x adalah $${targetMc.toLocaleString()}. Ruang pertumbuhan masih sangat lebar!</p>`;
                }

                // 3. Deteksi Tekanan Beli/Jual
                if (buyRatio >= 0.60) {
                    htmlLog += `<p class="text-emerald-600">✅ <b>Volume Akumulasi:</b> Rasio beli mencapai ${(buyRatio*100).toFixed(1)}%. Menunjukkan lebih banyak transaksi beli dibanding jual dalam 24 jam terakhir.</p>`;
                    lulusVolume = true;
                } else {
                    htmlLog += `<p class="text-red-500">❌ <b>Volume Distribusi:</b> Rasio beli rendah (${(buyRatio*100).toFixed(1)}%). Pasar didominasi aksi jual dalam 24 jam terakhir.</p>`;
                }

                document.getElementById('logAnalisis').innerHTML = htmlLog;

                // Kesimpulan Akhir
                const box = document.getElementById('boxKesimpulan');
                if (lulusKeamanan && lulusVolume && mc <= 5000000) {
                    box.className = "p-4 rounded-2xl text-center font-bold text-sm border bg-emerald-100 text-emerald-800 border-emerald-400 shadow-md";
                    box.innerHTML = "🌟 KESIMPULAN: METRIK DASAR TERPENUHI<br><span class='text-xs font-normal text-emerald-700'>Data on-chain menunjukkan pola positif. Ini bukan saran finansial — selalu lakukan riset mandiri (DYOR) sebelum mengambil keputusan.</span>";
                } else {
                    box.className = "p-4 rounded-2xl text-center font-bold text-sm border bg-red-100 text-red-700 border-red-300";
                    box.innerHTML = "❌ KESIMPULAN: RISIKO TINGGI TERDETEKSI<br><span class='text-xs font-normal text-red-600'>Struktur transaksi/likuiditas kurang sehat menurut metrik ini. Ini bukan saran finansial.</span>";
                }

                document.getElementById('hasil').classList.remove('hidden');

            } catch (err) {
                document.getElementById('loader').classList.add('hidden');
                alert('Gagal menyambung ke jaringan blockchain. Coba lagi beberapa saat lagi.');
            }
        }
    </script>
</body>
</html>
